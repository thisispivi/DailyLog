services:
  dailylog:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_PATH: /data/dailylog.sqlite3
      NODE_ENV: production
    ports:
      - "3000:3000"
    volumes:
      - dailylog_data:/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/login').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  dailylog_data:
