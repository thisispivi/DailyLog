services:
  dailylog:
    build: ./daily-log
    env_file:
      - ./daily-log/.env
    environment:
      DATABASE_PATH: /data/dailylog.sqlite3
    # Loopback only: other devices go through the HTTPS reverse proxy on this host.
    ports:
      - "127.0.0.1:14141:3000"
    volumes:
      - dailylog_data:/data
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache:uid=1001,gid=1001
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  dailylog_data:
