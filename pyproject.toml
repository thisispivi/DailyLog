[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "dailylogbot"
version = "0.2.0"
description = "Private Telegram bot with guided meals, activity tracking, and personal exports."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "openpyxl>=3.1.5",
  "python-dotenv>=1.0.1",
  "python-telegram-bot>=22.8,<23",
  "reportlab>=4.2.5",
  "tzdata>=2026.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dailylogbot = ["locales/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
