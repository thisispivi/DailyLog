[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dailylogbot"
version = "0.5.0"
description = "Private Telegram bot with guided meals, activity tracking, and personal exports."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "openpyxl>=3.1.5",
  "python-dotenv>=1.0.1",
  "python-telegram-bot>=22.8,<23",
  "reportlab>=4.2.5",
  "tzdata>=2026.1",
]

[dependency-groups]
dev = [
  "commitizen>=4.17.0",
  "deptry>=0.25",
  "detect-secrets>=1.5",
  "import-linter>=2.8",
  "interrogate>=1.7",
  "mypy>=2.3.0",
  "pip-audit>=2.9",
  "pre-commit>=4.6.1",
  "pytest>=8.3.4",
  "pytest-cov>=6.0",
  "ruff>=0.16.1",
  "vulture>=2.14",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dailylogbot = ["locales/*.json"]

[tool.uv]
required-version = ">=0.11.14,<0.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-config --strict-markers"

[tool.coverage.run]
branch = true
source = ["dailylogbot"]

[tool.coverage.report]
fail_under = 67
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.12"
files = ["src/dailylogbot"]
strict = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "truthy-bool", "redundant-self"]

[[tool.mypy.overrides]]
module = ["openpyxl.*", "reportlab.*"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "DTZ", "FA", "ISC", "PIE", "RET", "RUF", "SIM", "D", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D", "S101", "S106"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.importlinter]
root_package = "dailylogbot"

[[tool.importlinter.contracts]]
name = "DailyLog modules are acyclic"
type = "acyclic_siblings"
ancestors = ["dailylogbot"]

[tool.deptry]
known_first_party = ["dailylogbot"]

[tool.deptry.package_module_name_map]
python-dotenv = "dotenv"
python-telegram-bot = "telegram"

[tool.deptry.per_rule_ignores]
DEP002 = ["tzdata"]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_provider = "pep621"
version_scheme = "pep440"
