name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-main
  cancel-in-progress: false

# Fully automatic: Release Please opens or updates its release pull request,
# this job merges it straight away, and a second Release Please pass tags the
# release and publishes the GitHub release. No one has to approve anything.
#
# The merge uses GITHUB_TOKEN, so it does not trigger another workflow run;
# that is why the release is published here instead of on the next push.
jobs:
  release:
    name: Publish release
    runs-on: ubuntu-latest
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Release Please always uses the same branch for its pull request. The REST
      # pulls endpoint reads live data; "gh pr list --label" goes through the
      # search index and can miss a PR created seconds earlier in this same run.
      - name: Merge the release pull request
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head="$GITHUB_REPOSITORY_OWNER:release-please--branches--main--components--dailylog"
          numbers=$(gh api "repos/$GITHUB_REPOSITORY/pulls?state=open&head=$head" --jq ".[].number")
          for number in $numbers; do
            gh pr merge "$number" --repo "$GITHUB_REPOSITORY" --merge --delete-branch
          done
          echo "merged=${numbers:+true}" >> "$GITHUB_OUTPUT"

      - name: Tag and publish the release
        if: steps.merge.outputs.merged == 'true'
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: true
