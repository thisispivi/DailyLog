name: Release

# The version in VERSION_FILE drives releases (see AGENTS.md). Pull requests
# must bump it when code changes. When CI passes on main and the version has no
# tag yet, this workflow tags it and publishes the GitHub release. Nothing is
# committed back to main. Optional secret RELEASE_TOKEN (a fine-grained token
# with Contents: write) publishes releases as you instead of github-actions.

on:
  pull_request:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

env:
  VERSION_FILE: daily-log/package.json

jobs:
  version-bump:
    name: Version bump
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a version bump when code changes
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          # docs, test, ci, style, build, and chore pull requests ship nothing; chore(deps) does.
          if ! grep -qE '^chore\(deps\)' <<< "$TITLE" && grep -qE '^(docs|test|ci|style|build|chore)(\([^)]*\))?:' <<< "$TITLE"; then
            echo "\"$TITLE\" needs no release."; exit 0
          fi
          # Reads the first version-like line, which is the project version in every manifest used here.
          version() { git show "$1:$VERSION_FILE" | grep -m1 -E '^\s*"?(__)?version(__)?"?\s*[:=]' | grep -oE '[0-9]+(\.[0-9]+){2,3}' | head -n1; }
          code=$(git diff --name-only "$BASE" HEAD | grep -vE '(\.md$|^docs/|^\.github/|^\.claude/|^\.agents/|^LICENSE$)' || true)
          if [ -z "$code" ]; then echo "Only docs, CI, or agent files changed: no bump needed."; exit 0; fi
          base=$(version "$BASE"); head=$(version HEAD)
          if [ "$head" = "$base" ] || [ "$(printf '%s\n' "$base" "$head" | sort -V | tail -n1)" != "$head" ]; then
            echo "::error file=$VERSION_FILE::Code changed but the version did not go up ($base -> $head). Bump major, minor, or patch as AGENTS.md describes."
            exit 1
          fi
          echo "Version $base -> $head"

  release:
    name: Publish release
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      released: ${{ steps.publish.outputs.released }}
      version: ${{ steps.publish.outputs.version }}
      sha: ${{ steps.publish.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Tag and publish the version
        id: publish
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=$(grep -m1 -E '^\s*"?(__)?version(__)?"?\s*[:=]' "$VERSION_FILE" | grep -oE '[0-9]+(\.[0-9]+){2,3}' | head -n1)
          if [ -z "$version" ]; then echo "::error file=$VERSION_FILE::No version found"; exit 1; fi
          sha=$(git rev-parse HEAD)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          tag="v$version"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::notice::$tag is already released. Bump the version in $VERSION_FILE to publish a new release."
            exit 0
          fi
          latest=$(git tag --list 'v*' --sort=-version:refname | head -n1)
          if [ -n "$latest" ] && [ "$(printf '%s\n' "${latest#v}" "$version" | sort -V | tail -n1)" != "$version" ]; then
            echo "::error file=$VERSION_FILE::Version $version is older than the latest tag $latest"
            exit 1
          fi
          gh release create "$tag" --target "$sha" --title "$tag" --generate-notes
          echo "released=true" >> "$GITHUB_OUTPUT"

  # The playable demo at demo.dailylog.pivi.dev, rebuilt for every release.
  demo:
    name: Deploy the demo
    needs: release
    if: needs.release.outputs.released == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: daily-log
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.release.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: daily-log/package-lock.json
      - run: npm ci
      - run: npm run demo:build
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: daily-log/demo/out
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
