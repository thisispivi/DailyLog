name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-main
  cancel-in-progress: false

# Fully automatic: Release Please opens or updates its release pull request,
# this job merges it straight away, and a second Release Please pass tags the
# release and publishes the GitHub release. No one has to approve anything.
#
# The merge uses GITHUB_TOKEN, so it does not trigger another workflow run;
# that is why the release is published here instead of on the next push.
jobs:
  release:
    name: Publish release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      # The package lives in daily-log/, so Release Please reports releases_created,
      # not the release_created it sets for a package at the repository root.
      released: ${{ steps.publish.outputs.releases_created }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Release Please always uses the same branch for its pull request. The REST
      # pulls endpoint reads live data; "gh pr list --label" goes through the
      # search index and can miss a PR created seconds earlier in this same run.
      - name: Merge the release pull request
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head="$GITHUB_REPOSITORY_OWNER:release-please--branches--main--components--dailylog"
          numbers=$(gh api "repos/$GITHUB_REPOSITORY/pulls?state=open&head=$head" --jq ".[].number")
          for number in $numbers; do
            gh pr merge "$number" --repo "$GITHUB_REPOSITORY" --merge --delete-branch
          done
          echo "merged=${numbers:+true}" >> "$GITHUB_OUTPUT"

      - name: Tag and publish the release
        id: publish
        if: steps.merge.outputs.merged == 'true'
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: true

  # The playable demo at demo.dailylog.pivi.dev is deployed from an artifact.
  # Rebuild it for every release, or run it by hand
  # (workflow_dispatch) to redeploy without a release.
  demo:
    name: Deploy the demo
    needs: release
    if: always() && (needs.release.outputs.released == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: daily-log
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # The release commit Release Please just pushed, not the triggering one.
          ref: main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: daily-log/package-lock.json
      - run: npm ci
      - run: npm run demo:build
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: daily-log/demo/out
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
