name: Continuous integration

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and security
    defaults:
      run:
        working-directory: daily-log
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: daily-log/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --audit-level=low
      - run: npm run build
      - run: npm run demo:build

  browser:
    name: Browser flows
    defaults:
      run:
        working-directory: daily-log
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: daily-log/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: daily-log/playwright-report
          retention-days: 14

  container:
    name: Production container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Validate Compose configuration
        run: cp daily-log/.env.example daily-log/.env && docker compose config --quiet
      - run: docker build --tag dailylog:ci ./daily-log
      - name: Scan container for fixable high-severity vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: dailylog:ci
          exit-code: 1
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          vuln-type: os,library
      - name: Start container and wait for health
        run: |
          docker run --detach --name dailylog-ci --publish 3000:3000 \
            --env APP_PASSWORD=dailylog-ci-password \
            --env SESSION_SECRET=dailylog-ci-session-secret-at-least-32-characters \
            --env DATABASE_PATH=/data/dailylog.sqlite3 \
            dailylog:ci
          for _ in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/login > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs dailylog-ci
          exit 1
      - name: Stop container
        if: always()
        run: docker rm --force dailylog-ci || true

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Scan Git history
        run: >-
          docker run --rm --volume "$PWD:/repo" --workdir /repo
          zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          detect --source . --redact --verbose
