version: 2
updates:
  - package-ecosystem: npm
    directory: /daily-log
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    open-pull-requests-limit: 5
    groups:
      production:
        dependency-type: production
      development:
        dependency-type: development
    # Next's lint config (typescript-eslint and its ESLint plugins) does not run on
    # these majors yet. Drop each rule once eslint-config-next supports it.
    ignore:
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
  - package-ecosystem: docker
    directory: /daily-log
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
