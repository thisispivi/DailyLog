# Dependabot: security updates open as soon as an advisory lands; version
# updates arrive once a week, minor and patch grouped into one pull request.
# Triage both with the fix-vulnerabilities skill (.claude/skills/).
version: 2
updates:
  - package-ecosystem: npm
    directory: /daily-log
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
      dependencies:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
    # Next's lint config (typescript-eslint and its ESLint plugins) does not run on
    # these majors yet. Drop each rule once eslint-config-next supports it.
    ignore:
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /daily-log
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
      dependencies:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
      dependencies:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
      include: scope
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
      actions:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
