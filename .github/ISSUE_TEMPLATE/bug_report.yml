name: Bug report
description: Report reproducible behavior that differs from the expected result.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to improve DailyLog.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior and the expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include the DailyLog version, Python version, OS, and relevant configuration without secrets.
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove tokens, user data, and other sensitive values before submitting.
      render: text
