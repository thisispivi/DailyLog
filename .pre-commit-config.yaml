minimum_pre_commit_version: "4.6.0"
default_install_hook_types: [pre-commit, commit-msg]
fail_fast: false

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-ast
      - id: check-case-conflict
      - id: check-json
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: no-commit-to-branch
        args: [--branch, main]
      - id: trailing-whitespace
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]
      - id: ruff-lint
        name: ruff lint and import sorting
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: mypy
        name: strict mypy
        entry: uv run mypy
        language: system
        pass_filenames: false
        always_run: true
      - id: import-linter
        name: import cycle check
        entry: uv run lint-imports
        language: system
        pass_filenames: false
        always_run: true
      - id: dependency-linter
        name: dependency usage check
        entry: uv run deptry .
        language: system
        pass_filenames: false
        always_run: true
      - id: dead-code
        name: dead-code check
        entry: uv run vulture src tests --min-confidence 80
        language: system
        pass_filenames: false
        always_run: true
      - id: documentation
        name: documentation coverage
        entry: uv run interrogate --fail-under 100 src
        language: system
        pass_filenames: false
        always_run: true
      - id: compile
        name: Python bytecode compilation
        entry: uv run python -m compileall -q src
        language: system
        pass_filenames: false
        always_run: true
      - id: tests
        name: unit tests
        entry: uv run pytest -q
        language: system
        pass_filenames: false
        always_run: true
      - id: lockfile
        name: lockfile validation
        entry: uv lock --check
        language: system
        pass_filenames: false
        always_run: true
      - id: secrets
        name: secret scan
        entry: uv run detect-secrets-hook --baseline .secrets.baseline
        language: system
        types: [text]
      - id: conventional-commit
        name: conventional commit message
        entry: uv run cz check --commit-msg-file
        language: system
        stages: [commit-msg]
